services:
  qadeck:
    build: .
    container_name: qadeck
    restart: unless-stopped
    init: true
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - qadeck_data:/app/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  qadeck-worker:
    build: .
    container_name: qadeck-worker
    restart: unless-stopped
    init: true
    command: ["node", "src/worker.js"]
    env_file:
      - .env
    volumes:
      - qadeck_data:/app/data
    shm_size: "1gb"
    security_opt:
      - no-new-privileges:true
    depends_on:
      qadeck:
        condition: service_healthy
    stop_grace_period: 30s

volumes:
  qadeck_data:
