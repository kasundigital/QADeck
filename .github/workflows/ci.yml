name: QADeck CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Syntax check
        run: npm run check

      - name: Database migration smoke test
        env:
          DATA_DIR: /tmp/qadeck-ci-data
          CREDENTIALS_KEY: ci-only-test-key
        run: node -e "const db=require('./src/db'); console.log(db.prepare('select 1 as ok').get()); db.close();"
