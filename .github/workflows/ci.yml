name: QADeck CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Syntax check
        run: npm run check

      - name: Compile EJS templates
        run: node -e "const fs=require('fs'),path=require('path'),ejs=require('ejs'); for(const f of fs.readdirSync('views',{recursive:true})){if(String(f).endsWith('.ejs')) ejs.compile(fs.readFileSync(path.join('views',f),'utf8'),{filename:path.join('views',f)});} console.log('EJS OK');"

      - name: Database migration smoke test
        env:
          DATA_DIR: /tmp/qadeck-ci-data
          CREDENTIALS_KEY: ci-only-test-key
        run: node -e "const db=require('./src/db'); console.log(db.prepare('select 1 as ok').get()); db.close();"

      - name: Web health smoke test
        env:
          PORT: 3010
          DATA_DIR: /tmp/qadeck-ci-web
          CREDENTIALS_KEY: ci-only-test-key
          SESSION_SECRET: ci-session-secret
          QADECK_ADMIN_EMAIL: admin@example.com
          QADECK_ADMIN_PASSWORD: ci-password
        run: |
          npm start >/tmp/qadeck-web.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:3010/health; then exit 0; fi
            sleep 1
          done
          cat /tmp/qadeck-web.log
          exit 1


      - name: First-run setup wizard smoke test
        env:
          PORT: 3011
          DATA_DIR: /tmp/qadeck-ci-first-run
          SESSION_SECRET: ci-session-secret
          CREDENTIALS_KEY: ci-only-test-key
        run: |
          rm -rf "$DATA_DIR"
          npm start >/tmp/qadeck-first-run.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:3011/setup | grep -q "Welcome to QADeck"; then
              LOGIN_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3011/login)
              test "$LOGIN_CODE" = "302"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/qadeck-first-run.log
          exit 1

      - name: All-in-one runtime smoke test
        env:
          PORT: 3012
          DATA_DIR: /tmp/qadeck-ci-allinone
          QADECK_ADMIN_EMAIL: admin@example.com
          QADECK_ADMIN_PASSWORD: ci-password
          SESSION_SECRET: ci-session-secret
          CREDENTIALS_KEY: ci-only-test-key
        run: |
          npm run all-in-one >/tmp/qadeck-allinone.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:3012/health; then exit 0; fi
            sleep 1
          done
          cat /tmp/qadeck-allinone.log
          exit 1

  publish-image:
    name: Publish Docker image
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish QADeck
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/kasundigital/qadeck:latest
            ghcr.io/kasundigital/qadeck:main
            ghcr.io/kasundigital/qadeck:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/kasundigital/QADeck
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=QADeck
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy production Docker server
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.AUTO_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: qadeck-production-deploy
      cancel-in-progress: true
    steps:
      - name: Configure deployment SSH key
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_KNOWN_HOSTS" ]; then
            echo "Deployment secrets are not configured."
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/qadeck_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/qadeck_deploy ~/.ssh/known_hosts

      - name: Deploy QADeck
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?DEPLOY_HOST secret is required}"
          : "${DEPLOY_USER:?DEPLOY_USER secret is required}"
          PORT="${DEPLOY_PORT:-22}"

          ssh \
            -i ~/.ssh/qadeck_deploy \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -p "$PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /opt/QADeck

          PREVIOUS_SHA="$(git rev-parse HEAD)"
          echo "Current revision: $PREVIOUS_SHA"

          git fetch origin main
          git reset --hard origin/main
          echo "Deploying revision: $(git rev-parse HEAD)"

          rollback() {
            echo "Deployment failed. Rolling back to $PREVIOUS_SHA"
            git reset --hard "$PREVIOUS_SHA"
            docker compose up -d --build --remove-orphans || true
          }
          trap rollback ERR

          docker compose up -d --build --remove-orphans

          WEB_OK=0
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3000/health >/dev/null; then
              WEB_OK=1
              break
            fi
            sleep 2
          done

          if [ "$WEB_OK" -ne 1 ]; then
            echo "QADeck web health check failed."
            docker compose ps
            docker compose logs --tail=150 qadeck || true
            false
          fi

          if ! docker compose ps --status running --services | grep -qx 'qadeck-worker'; then
            echo "QADeck background worker is not running."
            docker compose ps
            docker compose logs --tail=150 qadeck-worker || true
            false
          fi

          trap - ERR
          docker compose ps
          echo "QADeck deployment completed successfully."
          REMOTE
